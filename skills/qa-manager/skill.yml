name: qa-manager
version: 0.1.0
description: >
  QA management for report-only requirements analysis, PRD review,
  traceability, risk classification, test strategy, test planning, test case
  design, defect process, QA reporting, and release sign-off. Use when the user
  needs a test plan, acceptance coverage, PICT or combinatorial scenario design,
  regression scope, go/no-go criteria, or an audit-style QA report. Not for
  writing automated test code — use qa-engineer. Not for running browser, API,
  or load checks — use qa-tester.
keywords:
  - qa
  - qa-manager
  - test-plan
  - test-strategy
  - requirements-analysis
  - test-cases
  - defect-reporting
  - release-signoff
includes:
  - prompt-injection-defense
  - output-contracts
  - quality-gates
