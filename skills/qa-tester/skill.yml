name: qa-tester
version: 0.1.0
description: >
  QA testing for report-only execution of safe checks and evidence capture. Use
  for running or planning browser UI sessions, Playwright or Cypress checks,
  API testing with Bruno, Postman, Supertest, REST Assured, or raw HTTP,
  performance and load checks with k6, Gatling, or JMeter, visual regression,
  exploratory testing, accessibility spot checks, and retest evidence. Not for
  writing durable automated test suites — use qa-engineer. Not for security
  audit ownership — use security-sast or security-dast.
keywords:
  - qa
  - qa-tester
  - browser-testing
  - api-testing
  - performance-testing
  - exploratory-testing
  - visual-regression
  - retest
includes:
  - prompt-injection-defense
  - output-contracts
  - quality-gates
